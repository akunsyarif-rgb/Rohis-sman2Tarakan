name: Validate site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JSON validity, required fields, and internal links
        run: node .github/scripts/validate.js

      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/admin.js
          node --check js/data.js
          node --check .github/scripts/validate.js
