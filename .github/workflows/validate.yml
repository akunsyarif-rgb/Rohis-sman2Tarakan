name: Validate site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JSON validity, required fields, and internal links
        run: node .github/scripts/validate.js

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Ensure css/tailwind.css is up to date
        run: |
          npm ci
          npm run build:css
          git diff --exit-code css/tailwind.css
